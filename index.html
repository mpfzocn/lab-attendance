<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SODIC-CU Lab Attendance</title>

<style>
:root{--navy:#0b2a43;--teal:#0d7c86;--teal-d:#0a5f67;--tint:#e6f2f3;--gold:#c9962b;--bg:#f2f5f7;--card:#fff;--ink:#14222d;--mute:#5f7280;--line:#dbe3e8;--ok:#17794a;--bad:#b3261e;--r:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--teal)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{flex:none;width:46px;height:46px;border:1.5px solid rgba(255,255,255,.55);border-radius:8px;display:grid;place-items:center;font:700 18px 'Source Serif 4',serif}
h1{margin:0;font:700 24px/1.2 'Source Serif 4',serif}
.brand p{margin:2px 0 0;font-size:13.5px;color:#b7cad8}
.clock{text-align:right;flex:none}
#clk{font:600 22px 'Source Serif 4',serif;font-variant-numeric:tabular-nums}
#cdate{font-size:13px;color:#b7cad8}
.hero{position:relative;margin:0 0 18px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--navy)}
.hero img{display:block;width:100%;height:clamp(180px,30vw,320px);object-fit:cover;object-position:50% 58%}
.hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:34px 18px 12px;color:#fff;font-size:14px;background:linear-gradient(to top,rgba(11,42,67,.88),rgba(11,42,67,0))}
.hero figcaption b{font:700 17px 'Source Serif 4',serif}
main{padding-top:20px;padding-bottom:30px}
.tool{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}

/* Calendar Card Styles */
.cal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head h3{margin:0;font:700 18px 'Source Serif 4',serif;color:var(--navy)}
.cal-nav{display:flex;align-items:center;gap:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-day-head{font-size:12px;font-weight:600;color:var(--mute);padding:4px 0}
.cal-day{aspect-ratio:1.2;border:1px solid var(--line);border-radius:6px;background:#fbfcfd;padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;cursor:pointer;font-size:13px;transition:all .15s}
.cal-day:hover{background:var(--tint);border-color:var(--teal)}
.cal-day.empty{border:0;background:none;cursor:default}
.cal-day.active{background:var(--teal);color:#fff;border-color:var(--teal-d);font-weight:600}
.cal-day.today{border:2px solid var(--gold)}
.cal-day .dot-count{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.cal-day.active .dot-count{background:#fff}

.ib{border:0;background:none;width:32px;height:32px;border-radius:7px;font-size:18px;line-height:1;color:var(--teal-d);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--tint)}
.badge{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#c28a00}.dot.on{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.stat{padding:16px 20px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat span{display:block;font-size:13px;color:var(--mute)}
.stat b{font:700 28px/1.25 'Source Serif 4',serif;color:var(--navy);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-bottom:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.card h2{margin:0 0 4px;font:700 19px 'Source Serif 4',serif;color:var(--navy)}
.sub{margin:0 0 14px;font-size:13.5px;color:var(--mute)}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:14px 0 5px}
input,select{width:100%;min-width:0;min-height:46px;padding:10px 10px;font:inherit;font-size:16px;color:var(--ink);background:#fbfcfd;border:1px solid var(--line);border-radius:8px}
input[type=date]{-webkit-appearance:none;appearance:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
#sid{font-size:18px;letter-spacing:1px;font-variant-numeric:tabular-nums}
#who{min-height:26px;margin-top:6px;font-weight:600;font-size:14.5px}
#who.ok{color:var(--ok)}#who.bad{color:var(--bad)}
.tp{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lnk{border:1px solid var(--line);background:none;color:var(--teal-d);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;font-size:13.5px;cursor:pointer}
.lnk:hover{background:var(--tint)}
.go{width:100%;min-height:50px;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:600 16px 'IBM Plex Sans',sans-serif;cursor:pointer}
.go:hover{background:var(--teal-d)}.go:disabled{opacity:.6;cursor:wait}
#msg{min-height:22px;margin-top:10px;font-size:14px}
.champ{display:flex;align-items:center;gap:10px;background:#fbf4e3;border:1px solid #ecd9a6;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:14px}
.champ svg{flex:none;color:var(--gold)}
.cbox{position:relative;width:100%}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.lh{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.lh .r{display:flex;gap:8px;align-items:center}
.lh input{width:220px}
.btn2{border:1px solid var(--teal);color:var(--teal-d);background:none;border-radius:8px;padding:8px 14px;min-height:46px;font:500 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
.btn2:hover{background:var(--tint)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--tint);color:var(--navy);text-align:left;font-weight:600;padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.dur{background:var(--tint);color:var(--teal-d);font-weight:600;border-radius:6px;padding:3px 9px;font-size:13px}
